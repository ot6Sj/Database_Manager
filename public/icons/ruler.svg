<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Ruler body -->
  <rect x="2" y="8" width="20" height="8" rx="1" fill="url(#ruleGrad)" opacity="0.25" stroke="url(#ruleGrad)" stroke-width="2"/>
  <!-- Tick marks -->
  <path d="M5 8v3M8 8v4M11 8v3M14 8v4M17 8v3M20 8v4" stroke="url(#ruleGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Number labels -->
