<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Hard drive body -->
  <rect x="2" y="6" width="20" height="12" rx="2" fill="url(#storeGrad)" opacity="0.25" stroke="url(#storeGrad)" stroke-width="2"/>
  <!-- Activity lights -->
  <circle cx="6" cy="12" r="2" fill="#10b981"/>
  <circle cx="11" cy="12" r="2" fill="url(#storeGrad)"/>
  <!-- Data bars -->
  <rect x="15" y="10" width="4" height="1.5" rx="0.5" fill="url(#storeGrad)"/>
  <rect x="15" y="12.5" width="3" height="1.5" rx="0.5" fill="url(#storeGrad)" opacity="0.7"/>
</svg>
