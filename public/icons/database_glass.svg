  <ellipse cx="12" cy="8" rx="8" ry="3" fill="url(#glassGrad)" stroke="url(#borderGrad)" stroke-width="0.5"/>
  
  <!-- Highlights/Reflections -->
  <path d="M6 9c0 .5 2 1.5 6 1.5s6-1 6-1.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.5" stroke-linecap="round"/>
