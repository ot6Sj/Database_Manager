  <!-- Content Cylinder (The "Data") -->
  <path d="M4 16v-6c0-1.66 4-3 8-3s8 1.34 8 3v6c0 1.66-4 3-8 3s-8-1.34-8-3z" fill="#764ba2" opacity="0.6"/>
  
