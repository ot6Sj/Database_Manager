<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="fkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Chain links -->
  <ellipse cx="8" cy="9" rx="5" ry="4" fill="url(#fkGrad)" opacity="0.2" stroke="url(#fkGrad)" stroke-width="2" transform="rotate(-45 8 9)"/>
  <ellipse cx="16" cy="15" rx="5" ry="4" fill="url(#fkGrad)" opacity="0.2" stroke="url(#fkGrad)" stroke-width="2" transform="rotate(-45 16 15)"/>
  <!-- Connection point -->
  <circle cx="12" cy="12" r="2" fill="url(#fkGrad)"/>
  <!-- FK label -->
  <text x="15" y="7" fill="url(#fkGrad)" font-size="5" font-weight="bold">FK</text>
</svg>
