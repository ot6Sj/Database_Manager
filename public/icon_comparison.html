<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Comparison</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 4rem;
        }

        .card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .icon-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 2rem;
            border-radius: 50%;
            margin-bottom: 1rem;
            display: inline-flex;
        }

        .icon-large {
            width: 128px;
            height: 128px;
        }

        h2 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        p {
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon-box">
            <img src="icons/database.svg" class="icon-large">
        </div>
        <h2>Current Style</h2>
        <p>Vibrant Gradient (Flat/Clean)</p>
    </div>

    <div class="card">
        <div class="icon-box">
            <img src="icons/database_glass.svg" class="icon-large">
        </div>
        <h2>Experimental Style</h2>
        <p>Glassmorphism (Frosted/3D)</p>
    </div>
</body>

</html>
